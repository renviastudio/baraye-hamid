<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>My Love — Songs Notebook for You</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e5e3de;
    --ink: #111111;
    --muted: #9a9a9a;
    --faint: #c8c8c8;
    --red: #e10600;
    --card: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { overflow-x: clip; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 18px;
    padding:
      max(16px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(22px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    overflow-x: clip;
  }

  button {
    font-family: inherit;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .brand, .foot { text-align: center; }

  .brand h1, .foot strong {
    display: block;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2em;
  }

  .brand p, .foot span {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #3d3d3d;
    font-weight: 500;
    line-height: 1.4;
    white-space: nowrap;
  }

  .card {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    background: var(--card);
    box-shadow: 0 18px 50px rgba(40, 36, 30, 0.05);
    overflow: hidden;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px 10px;
    flex-wrap: wrap;
    padding: 6px 10px 0 8px;
  }

  .mode, .nav {
    display: flex;
    align-items: center;
  }

  .nav { gap: 0; }

  .mode button, .nav button, .more {
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--ink);
    letter-spacing: 0.12em;
    font-size: 12px;
    font-weight: 600;
  }

  .mode button, .nav button {
    min-height: 44px;
    min-width: 44px;
    padding: 12px 8px;
  }

  .mode { gap: 0; }
  .mode .slash { color: #bdbdbd; font-size: 13px; padding: 0 2px; }
  .mode button.on { color: var(--red); }
  .nav button { color: #2a2a2a; position: relative; letter-spacing: 0.1em; }
  .nav button.on::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    height: 1px;
    background: var(--ink);
  }

  .card-body {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .vinyl-col {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 16px 8px;
    min-width: 0;
  }

  .vinyl {
    position: relative;
    width: min(68vw, 280px);
    height: min(68vw, 280px);
    flex: none;
  }

  .disc-wrap {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.04),
      12px 8px 24px rgba(0, 0, 0, 0.05);
  }

  .disc {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #161616 0 27%, #0a0a0a 27.4% 100%),
      repeating-radial-gradient(
        circle at 50% 50%,
        #070707 0px,
        #1c1c1c 1.4px,
        #101010 2.4px,
        #262626 3px,
        #0b0b0b 4.1px
      );
  }

  .disc.spin { animation: spin 9.5s linear infinite; }
  .disc.spin.paused { animation-play-state: paused; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .glass {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      conic-gradient(
        from 210deg,
        transparent 0deg,
        rgba(255,255,255,0.16) 28deg,
        transparent 78deg,
        transparent 180deg,
        rgba(255,255,255,0.07) 214deg,
        transparent 260deg
      );
    pointer-events: none;
  }

  .yt-dock {
    width: calc(100% - 24px);
    max-width: 640px;
    margin: 4px auto 16px;
    aspect-ratio: 16 / 9;
    background: #111;
  }

  .yt-dock[hidden] { display: none; }

  .yt-dock iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .spindle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 96px;
    height: 96px;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #ffffff 0 60%, #f3f1ec 100%);
    box-shadow:
      0 0 0 7px rgba(12,12,12,0.95),
      0 8px 16px rgba(0,0,0,0.18);
    cursor: pointer;
    display: grid;
    place-items: center;
    z-index: 2;
  }

  .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
  }

  .eq i {
    display: block;
    width: 3px;
    background: var(--red);
    border-radius: 1px;
    height: 8px;
  }

  .eq i:nth-child(1) { height: 8px; }
  .eq i:nth-child(2) { height: 16px; }
  .eq i:nth-child(3) { height: 11px; }
  .eq i:nth-child(4) { height: 18px; }

  .playing .eq i { animation: bar 0.85s ease-in-out infinite; transform-origin: center bottom; }
  .playing .eq i:nth-child(1) { animation-delay: 0.1s; }
  .playing .eq i:nth-child(2) { animation-delay: 0.25s; }
  .playing .eq i:nth-child(3) { animation-delay: 0s; }
  .playing .eq i:nth-child(4) { animation-delay: 0.4s; }

  @keyframes bar {
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(1); }
  }

  .disc-name {
    display: none;
    position: absolute;
    left: calc(50% + 78px);
    top: 45%;
    width: 132px;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    line-height: 1.4;
    z-index: 2;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  }

  .arc {
    position: absolute;
    inset: -12px;
    width: calc(100% + 24px);
    height: calc(100% + 24px);
    pointer-events: none;
  }

  .now-playing {
    margin-top: 12px;
    max-width: 100%;
    text-align: center;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.12em;
    line-height: 1.35;
    padding: 0 8px;
  }

  .time {
    margin-top: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #8d8d8d;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .player-msg {
    margin-top: 8px;
    max-width: 280px;
    text-align: center;
    font-size: 13px;
    line-height: 1.35;
    color: #9a2a2a;
  }

  .info {
    width: 100%;
    min-width: 0;
    padding: 6px 16px 18px;
    display: flex;
    flex-direction: column;
    container-type: inline-size;
  }

  .hero {
    font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 16cqw, 92px);
    line-height: 0.84;
    letter-spacing: 0.01em;
    max-width: 100%;
  }

  .hero span {
    display: block;
    white-space: nowrap;
    max-width: 100%;
  }

  .hero.swap { animation: rise 0.45s ease; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  .tags {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.45;
    color: #2c2c2c;
    overflow-wrap: break-word;
  }

  .whisper {
    margin-top: 6px;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.3;
    color: #3f3f3f;
  }

  .kicker {
    margin: 16px 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }

  .panel { min-width: 0; }

  .track, .note {
    width: 100%;
    border: 0;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: inherit;
    min-height: 52px;
  }

  .track {
    display: grid;
    grid-template-columns: 28px 42px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
  }

  .track:hover .track-title, .note:hover h3 { color: var(--red); }

  .num {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--faint);
    font-weight: 500;
  }

  .track.on .num, .note.on .num { color: var(--red); }

  .art {
    width: 42px;
    height: 42px;
    position: relative;
    overflow: hidden;
  }

  .art-moon {
    background:
      radial-gradient(circle at 68% 36%, #f6edd4 0 8px, transparent 9px),
      radial-gradient(circle at 22% 28%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 30% 70%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 78% 72%, #fff 0 1px, transparent 1.5px),
      linear-gradient(160deg, #243156, #101624);
  }

  .art-jazz {
    background:
      radial-gradient(circle at 72% 30%, transparent 10px, #f3e6d4 11px),
      linear-gradient(145deg, #8c3a3a, #e7d3b0 55%, #f7f1e6);
  }

  .art-jazz::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    right: 6px;
    top: 6px;
    background: #f7f1e6;
    box-shadow: -4px 2px 0 #8c3a3a;
  }

  .art-gold {
    background:
      linear-gradient(180deg, transparent 0 46%, #1a1a1a 46% 100%),
      linear-gradient(90deg, #f0c36a, #8a5a2a);
  }

  .art-gold::before, .art-gold::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 10px;
    background: #161616;
  }

  .art-gold::before { left: 8px; height: 22px; }
  .art-gold::after { right: 9px; height: 28px; }

  .art-smile {
    background: linear-gradient(160deg, #f2c14e, #e07a5f 45%, #6b2b3a);
  }

  .art-smile::before {
    content: "";
    position: absolute;
    left: 9px;
    right: 9px;
    bottom: 11px;
    height: 10px;
    border-bottom: 2px solid #fff8ee;
    border-radius: 0 0 12px 12px;
  }

  .art-smile::after {
    content: "";
    position: absolute;
    top: 12px;
    left: 12px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff8ee;
    box-shadow: 14px 0 0 #fff8ee;
  }

  .track-copy, .note-copy { min-width: 0; }

  .track-title {
    display: block;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.03em;
    line-height: 1.25;
    overflow-wrap: break-word;
  }

  .track-artist {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    letter-spacing: 0.08em;
    line-height: 1.3;
    color: var(--muted);
    font-weight: 500;
    overflow-wrap: break-word;
  }

  .dur {
    font-size: 12px;
    color: #b0b0b0;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  .more {
    margin-top: 8px;
    align-self: flex-end;
    min-height: 44px;
    padding: 12px 2px;
    text-decoration: underline;
    text-underline-offset: 3px;
    color: #8a8a8a;
    letter-spacing: 0.12em;
  }

  .more:hover { color: var(--ink); }

  .letter, .vow {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 22px;
    line-height: 1.4;
    color: #1c1c1c;
    max-width: 100%;
    overflow-wrap: break-word;
  }

  .page-no, .sign {
    font-family: Inter, sans-serif;
    font-style: normal;
    letter-spacing: 0.14em;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .page-no { display: block; margin-bottom: 12px; }
  .sign {
    display: block;
    margin-top: 16px;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0;
    font-weight: 400;
    color: #444;
  }

  .note {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    padding: 10px 0;
  }

  .note + .note { border-top: 1px solid #f0f0f0; }

  .note h3 {
    font-size: 12px;
    letter-spacing: 0.06em;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: break-word;
  }

  .note p {
    margin-top: 4px;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 16px;
    line-height: 1.35;
    color: #444;
    overflow-wrap: break-word;
  }

  .note.on h3 { color: var(--red); }

  @media (min-width: 980px) {
    body {
      align-items: center;
      justify-content: safe center;
      gap: 52px;
      padding: 48px 24px 56px;
    }

    .brand h1, .foot strong { font-size: 13px; letter-spacing: 0.22em; }
    .brand p, .foot span { letter-spacing: 0.18em; font-size: 11px; }

    .card-top { padding: 18px 34px 0 26px; flex-wrap: nowrap; }
    .nav { gap: 18px; }
    .nav button, .mode button { letter-spacing: 0.14em; font-size: 11px; min-width: 0; }
    .nav button.on::after { left: 0; right: 0; bottom: 6px; }

    .card-body {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.15fr);
      align-items: center;
      min-height: 540px;
    }

    .yt-dock { grid-column: 1 / -1; margin: 0 28px 22px; }

    .vinyl-col {
      height: 540px;
      display: block;
      padding: 0;
    }

    .vinyl {
      position: absolute;
      left: -118px;
      top: 28px;
      width: 470px;
      height: 470px;
    }

    .spindle {
      width: 132px;
      height: 132px;
      box-shadow:
        0 0 0 8px rgba(12,12,12,0.95),
        0 8px 16px rgba(0,0,0,0.18);
    }

    .disc-name { display: block; }
    .now-playing { display: none; }

    .time {
      position: absolute;
      left: 168px;
      bottom: 28px;
      margin: 0;
      text-align: left;
      font-size: 12px;
    }

    .player-msg {
      margin: 10px 0 0;
      max-width: 36em;
      text-align: left;
    }

    .info {
      min-height: 490px;
      padding: 18px 40px 28px 8px;
    }

    .hero { font-size: 104px; }
    .tags { letter-spacing: 0.12em; font-size: 11px; }
    .whisper { font-size: 18px; }
    .kicker { margin: 28px 0 12px; }
    .track { min-height: 0; padding: 8px 0; }
    .track-title { font-size: 13px; letter-spacing: 0.04em; }
    .letter, .vow { font-size: 26px; max-width: 22em; }
    .more { margin-top: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .disc.spin { animation: none; }
    .playing .eq i { animation: none; }
    .hero.swap { animation: none; }
  }
</style>
</head>
<body>
  <header class="brand">
    <h1>MY LOVE</h1>
    <p>SONGS NOTEBOOK FOR YOU</p>
  </header>

  <article class="card">
    <div class="card-top">
      <div class="mode" id="mode">
        <button type="button" data-mode="h" class="on">H</button>
        <span class="slash">/</span>
        <button type="button" data-mode="f">F</button>
      </div>
      <nav class="nav" id="nav">
        <button type="button" data-tab="pages" class="on">PAGES</button>
        <button type="button" data-tab="notes">NOTES</button>
        <button type="button" data-tab="vows">VOWS</button>
      </nav>
    </div>

    <div class="card-body">
      <div class="vinyl-col">
        <div class="vinyl">
          <svg class="arc" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="97" fill="none" stroke="#f0d0d0" stroke-width="0.45"
              stroke-dasharray="86 530" stroke-linecap="round" transform="rotate(8 100 100)"/>
            <circle cx="168" cy="112" r="2.1" fill="#e10600"/>
            <circle cx="168" cy="112" r="3.4" fill="none" stroke="#ffffff" stroke-width="1.1"/>
          </svg>
          <div class="disc-wrap">
            <div class="disc spin paused" id="disc"></div>
            <div class="glass"></div>
            <button class="spindle" id="playBtn" type="button" aria-label="Play">
              <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </button>
            <p class="disc-name" id="discName"></p>
          </div>
        </div>
        <p class="now-playing" id="nowPlaying"></p>
        <p class="time" id="time"></p>
      </div>
      <div class="yt-dock" id="yt-dock" hidden></div>

      <div class="info">
        <h2 class="hero" id="hero"></h2>
        <p class="tags" id="tags"></p>
        <p class="whisper" id="whisper"></p>
        <p class="player-msg" id="playerMsg" hidden></p>
        <p class="kicker" id="kicker">LETTERS</p>
        <div class="panel" id="panel"></div>
        <button class="more" id="more" type="button">VIEW MORE</button>
      </div>
    </div>
  </article>

  <footer class="foot">
    <strong>FOR YOU</strong>
    <span>NOW / ALWAYS</span>
  </footer>

<script>
const songs = [
  {
    n: "01",
    title: "TALKING TO THE MOON",
    lines: ["TALKING", "TO THE MOON"],
    artist: "BRUNO MARS",
    seconds: 217,
    videoId: "fXw0jcYbqdo",
    tags: "MOONLIGHT, LONGING, A LETTER",
    whisper: "I still say your name into the dark.",
    letter: "The moon has heard your name more times than I can count. I send the words up anyway, in case you are looking at the same light and missing me back.",
    art: "moon"
  },
  {
    n: "02",
    title: "FLY ME TO THE MOON",
    lines: ["FLY ME", "TO THE MOON"],
    artist: "FRANK SINATRA",
    seconds: 147,
    videoId: "JYuyWrkwpok",
    tags: "JAZZ, DANCING, FOREVER",
    whisper: "Anywhere is home if you are there.",
    letter: "I would trade every ordinary evening for one more song with you. Play this, and we are already dancing somewhere the clocks cannot follow.",
    art: "jazz"
  },
  {
    n: "03",
    title: "STANDING NEXT TO YOU",
    lines: ["STANDING", "NEXT TO YOU"],
    artist: "JUNG KOOK",
    seconds: 206,
    videoId: "UNo0TG9LwwI",
    tags: "CLOSE, WARM, YOURS",
    whisper: "Just the place beside you. That is enough.",
    letter: "I don't need a bigger life. I need the quiet proof of you beside me — your shoulder, your laugh, the way the room changes when you stay.",
    art: "gold"
  },
  {
    n: "04",
    title: "DIE WITH A SMILE",
    lines: ["DIE WITH", "A SMILE"],
    artist: "LADY GAGA & BRUNO MARS",
    seconds: 251,
    videoId: "kPa7bsKwL-c",
    tags: "A DUET, A PROMISE, ALWAYS",
    whisper: "Let the last light find us smiling.",
    letter: "If the night runs out, let it find us still close, still kind, still smiling like we knew the ending and chose each other anyway.",
    art: "smile"
  }
];

const vow = "These four songs are the margins of this notebook. One for the nights I talk to the sky. One for the dance I still owe you. One for the place beside me that is yours. One for the promise that, however it ends, it ends with you.";

let index = 0;
let playing = false;
let elapsed = 0;
let mode = "h";
let tab = "pages";
const dock = document.getElementById("yt-dock");

const disc = document.getElementById("disc");
const playBtn = document.getElementById("playBtn");
const discName = document.getElementById("discName");
const nowPlaying = document.getElementById("nowPlaying");
const timeEl = document.getElementById("time");
const playerMsg = document.getElementById("playerMsg");
const hero = document.getElementById("hero");
const tags = document.getElementById("tags");
const whisper = document.getElementById("whisper");
const kicker = document.getElementById("kicker");
const panel = document.getElementById("panel");
const more = document.getElementById("more");

function fmt(total) {
  const s = Math.max(0, Math.floor(total || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function escapeHtml(value) {
  return value.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}

function showMsg(text) {
  playerMsg.hidden = false;
  playerMsg.textContent = text;
}

function hideMsg() {
  playerMsg.hidden = true;
  playerMsg.textContent = "";
}

function renderTime() {
  const song = songs[index];
  const total = song.liveDuration || song.seconds;
  timeEl.textContent = fmt(elapsed) + "  /  " + fmt(total);
}

function fitHero() {
  hero.style.fontSize = "";
  const limit = hero.clientWidth;
  const spans = hero.querySelectorAll("span");
  if (!limit || !spans.length) return;
  let size = parseFloat(getComputedStyle(hero).fontSize);
  let guard = 0;
  while (guard < 40 && size > 30) {
    let overflow = false;
    spans.forEach((span) => {
      if (span.scrollWidth > limit + 1) overflow = true;
    });
    if (!overflow) break;
    size -= 2;
    hero.style.fontSize = size + "px";
    guard += 1;
  }
}

function renderPanel() {
  const song = songs[index];

  if (tab === "vows") {
    kicker.textContent = "A VOW";
    panel.innerHTML = '<p class="vow"><span class="page-no">KEPT IN THIS BOOK</span>' + escapeHtml(vow) + '<span class="sign">— yours, always</span></p>';
    return;
  }

  if (tab === "notes") {
    kicker.textContent = "ALL NOTES";
    panel.innerHTML = songs.map((item, i) => (
      '<button class="note' + (i === index ? " on" : "") + '" type="button" data-i="' + i + '">' +
        '<span class="num">' + item.n + '</span>' +
        '<span class="note-copy"><h3>' + item.title + '</h3><p>' + escapeHtml(item.letter) + '</p></span>' +
      '</button>'
    )).join("");
    return;
  }

  if (mode === "f") {
    kicker.textContent = "THIS PAGE";
    panel.innerHTML = '<p class="letter"><span class="page-no">PAGE ' + song.n + '  ·  ' + song.artist + '</span>' +
      escapeHtml(song.letter) + '<span class="sign">— yours</span></p>';
    return;
  }

  kicker.textContent = "LETTERS";
  panel.innerHTML = songs.map((item, i) => (
    '<button class="track' + (i === index ? " on" : "") + '" type="button" data-i="' + i + '">' +
      '<span class="num">' + item.n + '</span>' +
      '<span class="art art-' + item.art + '" aria-hidden="true"></span>' +
      '<span class="track-copy"><span class="track-title">' + item.title + '</span><span class="track-artist">' + item.artist + '</span></span>' +
      '<span class="dur">' + fmt(item.liveDuration || item.seconds) + '</span>' +
    '</button>'
  )).join("");
}

function render(animate) {
  const song = songs[index];
  hero.innerHTML = song.lines.map((line) => "<span>" + line + "</span>").join("");
  if (animate) {
    hero.classList.remove("swap");
    void hero.offsetWidth;
    hero.classList.add("swap");
  }
  tags.textContent = song.artist + "   ·   " + song.tags;
  whisper.textContent = song.whisper;
  discName.textContent = song.n + ".  " + song.title;
  nowPlaying.textContent = song.n + "   " + song.title;
  disc.classList.toggle("paused", !playing);
  playBtn.classList.toggle("playing", playing);
  playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
  more.textContent = tab === "pages" ? "VIEW MORE" : "BACK";
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.mode === mode);
  });
  document.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.tab === tab);
  });
  renderPanel();
  renderTime();
  fitHero();
}

function embedSrc(id) {
  const query = new URLSearchParams({
    autoplay: "1",
    playsinline: "1",
    rel: "0",
    modestbranding: "1",
    enablejsapi: "1",
    origin: location.origin,
    widget_referrer: location.href
  });
  return "https://www.youtube.com/embed/" + id + "?" + query.toString();
}

function ytCommand(func, args) {
  const frame = document.getElementById("yt-frame");
  if (!frame || !frame.contentWindow) return;
  frame.contentWindow.postMessage(JSON.stringify({
    event: "command",
    func: func,
    args: args || []
  }), "*");
}

function ensureFrame(id) {
  dock.hidden = false;
  const existing = document.getElementById("yt-frame");
  if (existing && existing.dataset.id === id) {
    ytCommand("playVideo");
    ytCommand("unMute");
    return;
  }
  const frame = document.createElement("iframe");
  frame.id = "yt-frame";
  frame.dataset.id = id;
  frame.title = songs[index].title;
  frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  frame.setAttribute("allow", "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen");
  frame.setAttribute("playsinline", "1");
  frame.allowFullscreen = true;
  frame.src = embedSrc(id);
  dock.replaceChildren(frame);
  frame.addEventListener("load", () => {
    try {
      frame.contentWindow.postMessage(JSON.stringify({ event: "listening", id: "yt-frame" }), "*");
    } catch (err) {}
    ytCommand("unMute");
    ytCommand("setVolume", [100]);
    if (playing) ytCommand("playVideo");
  });
  dock.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function playCurrent(animate) {
  playing = true;
  hideMsg();
  showMsg("If the song stays quiet, press play on the video.");
  render(!!animate);
  ensureFrame(songs[index].videoId);
}

function pauseCurrent() {
  playing = false;
  ytCommand("pauseVideo");
  render(false);
}

function choose(next) {
  if (next === index && playing) {
    elapsed = 0;
    ytCommand("seekTo", [0, true]);
    ytCommand("playVideo");
    render(false);
    return;
  }
  index = next;
  elapsed = 0;
  songs[index].liveDuration = 0;
  playCurrent(true);
}

document.getElementById("mode").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-mode]");
  if (!btn) return;
  mode = btn.dataset.mode;
  tab = "pages";
  render(false);
});

document.getElementById("nav").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-tab]");
  if (!btn) return;
  tab = btn.dataset.tab;
  render(false);
});

panel.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-i]");
  if (!btn) return;
  choose(Number(btn.dataset.i));
});

playBtn.addEventListener("click", () => {
  if (playing) pauseCurrent();
  else playCurrent(false);
});

more.addEventListener("click", () => {
  tab = tab === "pages" ? "notes" : "pages";
  render(false);
});

document.addEventListener("keydown", (event) => {
  if (event.code === "Space") {
    event.preventDefault();
    if (playing) pauseCurrent();
    else playCurrent(false);
  } else if (event.code === "ArrowDown" || event.code === "ArrowRight") {
    choose((index + 1) % songs.length);
  } else if (event.code === "ArrowUp" || event.code === "ArrowLeft") {
    choose((index - 1 + songs.length) % songs.length);
  }
});

let lastSync = 0;

window.addEventListener("message", (event) => {
  if (!String(event.origin).includes("youtube.com")) return;
  let data = event.data;
  if (typeof data === "string") {
    try { data = JSON.parse(data); } catch (err) { return; }
  }
  if (!data) return;
  if (data.event === "onError") {
    showMsg("This recording cannot start here. Press play on the video, or try another song.");
    return;
  }
  const info = data.info || {};
  if (typeof info.currentTime === "number") {
    elapsed = info.currentTime;
    lastSync = Date.now();
  }
  if (typeof info.duration === "number" && info.duration > 1) songs[index].liveDuration = info.duration;
  if (info.playerState === 1) {
    playing = true;
    lastSync = Date.now();
    hideMsg();
    render(false);
  } else if (info.playerState === 2) {
    playing = false;
    render(false);
  } else if (info.playerState === 0) {
    choose((index + 1) % songs.length);
  }
});

setInterval(() => {
  if (!playing || Date.now() - lastSync < 1500) return;
  elapsed += 0.25;
  const total = songs[index].liveDuration || songs[index].seconds;
  if (elapsed >= total + 1) {
    choose((index + 1) % songs.length);
    return;
  }
  renderTime();
}, 250);

window.addEventListener("resize", fitHero);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHero);

render(false);
</script>
</body>
</html>
