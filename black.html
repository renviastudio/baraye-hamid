<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحه مشکی</title>
<style>
  @page {
    size: 7cm 10cm;
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #d9d6d0;
  }

  .page {
    width: 7cm;
    height: 10cm;
    background: #000;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
  }

  @media print {
    body {
      display: block;
      min-height: 0;
      width: 7cm;
      height: 10cm;
      background: #000;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 7cm;
      height: 10cm;
      box-shadow: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
  <div class="page" role="img" aria-label="صفحه مشکی، ۷ در ۱۰ سانتی‌متر"></div>
</body>
</html>
